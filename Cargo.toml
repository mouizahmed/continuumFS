[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/mouizahmed/continuumFS"
publish = false

[workspace.dependencies]
ctm-core = { path = "crates/ctm-core" }
ctm-store = { path = "crates/ctm-store" }
ctm-repo = { path = "crates/ctm-repo" }
ctm-fs = { path = "crates/ctm-fs" }

async-trait = "0.1"
blake3 = "1.8"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
fastcdc = "=5.0.0"
fuser = "0.18"
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
libc = "0.2"
object_store = { version = "0.14", features = ["aws"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26", features = ["v4"] }

insta = "1.48"
proptest = "1.11"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
