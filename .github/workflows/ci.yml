name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CTM_TEST_S3_URL: s3://ctm-test
  CTM_TEST_S3_ENDPOINT: http://localhost:9000
  AWS_ACCESS_KEY_ID: ctmtest
  AWS_SECRET_ACCESS_KEY: ctmtestsecret
  AWS_REGION: us-east-1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: docker compose up -d s3 && docker compose run --rm s3-init
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
